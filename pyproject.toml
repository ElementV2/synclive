[project]
name = "synclive"
version = "1.3.0"
description = "Mesure du décalage son/image par source (caméras, PC, consoles) et mires de synchro."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ElementV2" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "av>=13",
    "PySide6>=6.7",
    "pillow>=10",
    "mediapipe>=0.10.20",
]

[project.urls]
Repository = "https://github.com/ElementV2/synclive"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
synclive-cli = "synclive.cli:main"

[project.gui-scripts]
synclive = "synclive.ui:main"

[tool.setuptools]
packages = ["synclive"]

[tool.setuptools.package-data]
synclive = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
